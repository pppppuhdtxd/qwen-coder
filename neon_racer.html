<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Racer - مسابقه تونلی سایبرپانک</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-green: #00ff41;
            --bg-dark: #050510;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 600px;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.1);
            overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            text-shadow: 0 0 10px var(--neon-blue);
        }
        .score-box, .speed-box {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        .menu-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: auto;
            transition: opacity 0.3s;
        }
        .hidden { opacity: 0; pointer-events: none; }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
        }
        .btn {
            background: linear-gradient(45deg, var(--neon-blue), #0088ff);
            border: none;
            padding: 15px 40px;
            color: #000;
            font-weight: bold;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 0 20px var(--neon-blue);
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 40px var(--neon-blue); }
        .btn:active { transform: scale(0.95); }
        .stats { margin-top: 20px; text-align: center; color: #aaa; font-size: 0.9rem; }
        .controls-hint { margin-top: 30px; font-size: 0.8rem; color: var(--neon-green); opacity: 0.8; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-layer">
        <div class="hud-top">
            <div class="score-box">امتیاز: <span id="scoreEl">0</span></div>
            <div class="speed-box">سرعت: <span id="speedEl">0</span> km/h</div>
        </div>
    </div>

    <div id="startMenu" class="menu-screen">
        <h1>NEON RACER</h1>
        <p style="color: var(--neon-pink); letter-spacing: 2px;">تونل بی‌پایان سایبری</p>
        <button class="btn" id="startBtn">شروع مسابقه</button>
        <div class="stats">بهترین رکورد: <span id="highScoreEl">0</span></div>
        <div class="controls-hint">کنترل: کلیدهای چپ/راست یا لمس صفحه</div>
    </div>

    <div id="gameOverMenu" class="menu-screen hidden">
        <h1 style="color: var(--neon-pink);">GAME OVER</h1>
        <p style="font-size: 1.5rem;">امتیاز نهایی: <span id="finalScore">0</span></p>
        <button class="btn" id="restartBtn">تلاش مجدد</button>
    </div>
</div>

<script>
class SoundSynth {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.3;
        this.masterGain.connect(this.ctx.destination);
    }
    playTone(freq, type, duration, vol = 1) {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    }
    playCrash() { this.playTone(100, 'sawtooth', 0.5, 0.8); this.playTone(50, 'square', 0.6, 0.8); }
    playScore() { this.playTone(800, 'sine', 0.1, 0.5); setTimeout(() => this.playTone(1200, 'sine', 0.2, 0.5), 100); }
}

class Particle {
    constructor() { this.reset(); }
    reset() { this.x = 0; this.y = 0; this.vx = 0; this.vy = 0; this.life = 0; this.maxLife = 1; this.color = '#fff'; this.size = 2; this.active = false; }
    spawn(x, y, vx, vy, color, life) { this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.color = color; this.life = life; this.maxLife = life; this.active = true; }
    update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; this.life -= dt; this.size *= 0.95; return this.life <= 0; }
    draw(ctx) { ctx.globalAlpha = this.life / this.maxLife; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
}

class Obstacle {
    constructor() { this.reset(); }
    reset() { this.x = 0; this.y = -100; this.w = 60; this.h = 40; this.speed = 0; this.type = 0; this.active = false; this.rotation = 0; }
    spawn(y, speed, laneWidth, lanes) {
        this.y = y; this.speed = speed;
        const lane = Math.floor(Math.random() * lanes);
        this.x = (lane - lanes/2 + 0.5) * laneWidth;
        this.w = laneWidth * 0.6; this.h = 30;
        this.type = Math.random() > 0.5 ? 'rect' : 'tri';
        this.rotation = 0; this.active = true;
    }
    update(dt, speedOffset) { this.y += (this.speed + speedOffset) * dt; this.rotation += 5 * dt; return this.y > 800; }
    draw(ctx, cameraY) {
        const drawY = this.y - cameraY;
        ctx.save(); ctx.translate(this.x, drawY); ctx.rotate(this.rotation * Math.PI / 180);
        ctx.shadowBlur = 15; ctx.shadowColor = '#ff00ff'; ctx.fillStyle = '#ff00ff';
        if (this.type === 'rect') ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
        else { ctx.beginPath(); ctx.moveTo(0, -this.h/2); ctx.lineTo(this.w/2, this.h/2); ctx.lineTo(-this.w/2, this.h/2); ctx.fill(); }
        ctx.restore();
    }
}

class NeonRacer {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.width = this.canvas.width = window.innerWidth > 600 ? 600 : window.innerWidth;
        this.height = this.canvas.height = window.innerHeight;
        this.audio = new SoundSynth();
        this.lastTime = 0; this.score = 0; this.speed = 0; this.baseSpeed = 400; this.distance = 0; this.gameState = 'MENU';
        this.player = { x: 0, y: this.height - 100, w: 40, h: 60, vx: 0, tilt: 0 };
        this.lanes = 5; this.laneWidth = this.width / this.lanes;
        this.pools = { particles: [], obstacles: [] };
        for(let i=0; i<200; i++) this.pools.particles.push(new Particle());
        for(let i=0; i<50; i++) this.pools.obstacles.push(new Obstacle());
        this.activeParticles = []; this.activeObstacles = []; this.obstacleTimer = 0; this.cameraY = 0;
        this.highScore = parseInt(localStorage.getItem('neonRacerHighScore')) || 0;
        document.getElementById('highScoreEl').innerText = this.highScore;
        this.bindInput();
        this.resize();
        window.addEventListener('resize', () => this.resize());
        requestAnimationFrame(t => this.loop(t));
    }
    resize() { this.width = this.canvas.width = this.canvas.parentElement.clientWidth; this.height = this.canvas.height = this.canvas.parentElement.clientHeight; this.laneWidth = this.width / this.lanes; this.player.y = this.height - 100; }
    bindInput() {
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);
        let touchX = null;
        this.canvas.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, {passive: false});
        this.canvas.addEventListener('touchmove', e => { e.preventDefault(); touchX = e.touches[0].clientX; }, {passive: false});
        this.canvas.addEventListener('touchend', () => touchX = null);
        this.inputHandler = (dt) => {
            const moveLeft = keys['ArrowLeft'] || keys['KeyA'] || (touchX !== null && touchX < this.width/2 - 20);
            const moveRight = keys['ArrowRight'] || keys['KeyD'] || (touchX !== null && touchX > this.width/2 + 20);
            if (moveLeft) { this.player.vx = -300; this.player.tilt = -0.3; }
            else if (moveRight) { this.player.vx = 300; this.player.tilt = 0.3; }
            else { this.player.vx *= 0.8; this.player.tilt *= 0.8; }
            this.player.x += this.player.vx * dt;
            if (this.player.x < -this.width/2) this.player.x = -this.width/2;
            if (this.player.x > this.width/2) this.player.x = this.width/2;
        };
        document.getElementById('startBtn').addEventListener('click', () => this.startGame());
        document.getElementById('restartBtn').addEventListener('click', () => this.startGame());
    }
    startGame() {
        this.gameState = 'PLAYING'; this.score = 0; this.speed = this.baseSpeed; this.distance = 0; this.player.x = 0;
        this.activeObstacles = []; this.activeParticles = [];
        document.getElementById('startMenu').classList.add('hidden');
        document.getElementById('gameOverMenu').classList.add('hidden');
        this.audio.ctx.resume();
    }
    gameOver() {
        this.gameState = 'GAMEOVER'; this.audio.playCrash();
        if (this.score > this.highScore) {
            this.highScore = Math.floor(this.score);
            localStorage.setItem('neonRacerHighScore', this.highScore);
            document.getElementById('highScoreEl').innerText = this.highScore;
        }
        document.getElementById('finalScore').innerText = Math.floor(this.score);
        document.getElementById('gameOverMenu').classList.remove('hidden');
    }
    spawnObstacle() {
        const obs = this.pools.obstacles.find(o => !this.activeObstacles.includes(o));
        if (obs) { obs.spawn(-100 - Math.random() * 200, this.speed, this.laneWidth, this.lanes); this.activeObstacles.push(obs); }
    }
    createExplosion(x, y, color) {
        for(let i=0; i<15; i++) {
            const p = this.pools.particles.find(pt => !this.activeParticles.includes(pt));
            if (p) { const angle = Math.random() * Math.PI * 2; const spd = Math.random() * 200 + 50; p.spawn(x, y, Math.cos(angle)*spd, Math.sin(angle)*spd, color, 0.5 + Math.random()*0.5); this.activeParticles.push(p); }
        }
    }
    update(dt) {
        if (this.gameState !== 'PLAYING') return;
        this.speed += dt * 10; this.distance += this.speed * dt; this.score += (this.speed * dt) / 100;
        this.inputHandler(dt);
        this.obstacleTimer -= dt;
        if (this.obstacleTimer <= 0) { this.spawnObstacle(); this.obstacleTimer = 1000 / (this.speed * 0.8); }
        for (let i = this.activeObstacles.length - 1; i >= 0; i--) {
            const obs = this.activeObstacles[i];
            if (obs.update(dt, this.speed * 0.5)) { this.activeObstacles.splice(i, 1); this.score += 10; this.audio.playScore(); continue; }
            const playerRect = { l: this.player.x - this.player.w/2, r: this.player.x + this.player.w/2, t: this.player.y - this.player.h/2, b: this.player.y + this.player.h/2 };
            const obsRect = { l: obs.x - obs.w/2, r: obs.x + obs.w/2, t: obs.y - obs.h/2, b: obs.y + obs.h/2 };
            if (obs.active && playerRect.l < obsRect.r && playerRect.r > obsRect.l && playerRect.t < obsRect.b && playerRect.b > obsRect.t) {
                this.createExplosion(this.player.x, this.player.y, '#00f3ff'); this.gameOver();
            }
        }
        for (let i = this.activeParticles.length - 1; i >= 0; i--) { if (this.activeParticles[i].update(dt)) this.activeParticles.splice(i, 1); }
        document.getElementById('scoreEl').innerText = Math.floor(this.score);
        document.getElementById('speedEl').innerText = Math.floor(this.speed / 10);
    }
    draw() {
        this.ctx.fillStyle = 'rgba(5, 5, 16, 0.4)'; this.ctx.fillRect(0, 0, this.width, this.height);
        this.ctx.save(); this.ctx.translate(this.width/2, 0);
        this.ctx.strokeStyle = 'rgba(0, 243, 255, 0.2)'; this.ctx.lineWidth = 2; this.ctx.shadowBlur = 10; this.ctx.shadowColor = '#00f3ff';
        const gridOffset = (this.distance % 100) / 100;
        for (let i = -this.lanes/2; i <= this.lanes/2; i++) {
            const x = i * this.laneWidth; this.ctx.beginPath(); this.ctx.moveTo(x, 0); this.ctx.lineTo(x * 4, this.height); this.ctx.stroke();
        }
        for (let i = 0; i < 10; i++) {
            const y = (i * 100 + (this.distance % 100)) * (1 + i*0.2); if (y > this.height) continue;
            this.ctx.beginPath(); this.ctx.moveTo(-y, y); this.ctx.lineTo(y, y); this.ctx.stroke();
        }
        if (this.gameState !== 'GAMEOVER' || Math.floor(Date.now() / 100) % 2 === 0) {
            this.ctx.save(); this.ctx.translate(this.player.x, this.player.y); this.ctx.rotate(this.player.tilt);
            this.ctx.shadowBlur = 20; this.ctx.shadowColor = '#00ff41'; this.ctx.fillStyle = '#00ff41';
            this.ctx.beginPath(); this.ctx.moveTo(0, -this.player.h/2); this.ctx.lineTo(this.player.w/2, this.player.h/2); this.ctx.lineTo(0, this.player.h/2 - 10); this.ctx.lineTo(-this.player.w/2, this.player.h/2); this.ctx.closePath(); this.ctx.fill();
            this.ctx.fillStyle = '#fff'; this.ctx.beginPath(); this.ctx.arc(0, this.player.h/2 - 5, 5 + Math.random()*3, 0, Math.PI*2); this.ctx.fill();
            this.ctx.restore();
        }
        this.activeObstacles.forEach(obs => obs.draw(this.ctx));
        this.activeParticles.forEach(p => p.draw(this.ctx));
        this.ctx.restore();
    }
    loop(timestamp) { const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1); this.lastTime = timestamp; this.update(dt); this.draw(); requestAnimationFrame(t => this.loop(t)); }
}
window.onload = () => { const game = new NeonRacer(); };
</script>
</body>
</html>
