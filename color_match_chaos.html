<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Color Match Chaos</title><style>:root{--neon-blue:#00f3ff;--neon-pink:#ff00ff;--neon-green:#00ff41;--bg:#050510}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:#fff;font-family:sans-serif;overflow:hidden;height:100vh;display:flex;justify-content:center;align-items:center}#game-container{position:relative;width:100%;height:100%;max-width:700px;background:radial-gradient(circle,#1a1a2e,#000)}canvas{display:block;width:100%;height:100%}.ui{position:absolute;top:0;left:0;width:100%;padding:20px;display:flex;justify-content:space-between;z-index:10}.panel{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);padding:10px 20px;border-radius:12px}.menu{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20}.hidden{display:none}h1{font-size:2.5rem;background:linear-gradient(90deg,var(--neon-blue),var(--neon-pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:20px}.btn{background:linear-gradient(45deg,var(--neon-blue),#0088ff);border:none;padding:15px 40px;color:#000;font-weight:bold;border-radius:30px;cursor:pointer;margin:10px;box-shadow:0 0 20px var(--neon-blue)}.btn:hover{transform:scale(1.05)}</style></head><body><div id="game-container"><canvas id="c"></canvas><div class="ui"><div class="panel">Score: <span id="score">0</span></div></div><div id="startMenu" class="menu"><h1>Color Match Chaos</h1><button class="btn" onclick="game.start()">Start Game</button></div></div><script>
class Sound{constructor(){this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.g=this.ctx.createGain();this.g.gain.value=0.3;this.g.connect(this.ctx.destination)}play(f,t,d){if(this.ctx.state==='suspended')this.ctx.resume();const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(0.3,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+d);o.connect(g);g.connect(this.g);o.start();o.stop(this.ctx.currentTime+d)}}
class Game{constructor(){this.c=document.getElementById('c');this.x=this.c.getContext('2d');this.resize();this.audio=new Sound();this.score=0;this.gameState='MENU';this.entities=[];this.particles=[];this.lastTime=0;this.bindInput();window.addEventListener('resize',()=>this.resize());requestAnimationFrame(t=>this.loop(t))}resize(){this.width=this.c.width=this.c.parentElement.clientWidth;this.height=this.c.height=this.c.parentElement.clientHeight}bindInput(){this.c.addEventListener('click',e=>{if(this.gameState!=='PLAYING')return;const r=this.c.getBoundingClientRect();this.handleClick(e.clientX-r.x,e.clientY-r.y)});this.c.addEventListener('touchstart',e=>{if(this.gameState!=='PLAYING')return;const r=this.c.getBoundingClientRect();this.handleClick(e.touches[0].clientX-r.x,e.touches[0].clientX-r.y)}, {passive:false})}handleClick(x,y){this.audio.play(600,'sine',0.1);this.particles.push({x,y,vx:(Math.random()-0.5)*100,vy:(Math.random()-0.5)*100,life:0.5,color:'#00f3ff'});this.score+=10;document.getElementById('score').innerText=this.score}start(){document.getElementById('startMenu').classList.add('hidden');this.gameState='PLAYING';this.score=0;this.audio.play(800,'sine',0.2)}loop(t){const dt=Math.min((t-this.lastTime)/1000,0.1);this.lastTime=t;this.x.fillStyle='rgba(5,5,16,0.2)';this.x.fillRect(0,0,this.width,this.height);if(this.gameState==='PLAYING'){this.x.save();this.x.translate(this.width/2,this.height/2);for(let i=0;i<6;i++){this.x.rotate(Math.PI/3);this.x.strokeStyle='rgba(0,243,255,0.3)';this.x.beginPath();this.x.moveTo(0,0);this.x.lineTo(0,-150);this.x.stroke()}this.x.restore();this.particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});this.particles=this.particles.filter(p=>p.life>0);this.particles.forEach(p=>{this.x.fillStyle=p.color;this.x.globalAlpha=p.life*2;this.x.beginPath();this.x.arc(p.x,p.y,4,0,Math.PI*2);this.x.fill()});this.x.globalAlpha=1}requestAnimationFrame(t=>this.loop(t))}}
const game=new Game();
</script></body></html>
