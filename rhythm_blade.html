<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Rhythm Blade</title><style>:root{--neon-blue:#00f3ff;--neon-pink:#ff00ff;--bg:#050510}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:#fff;font-family:sans-serif;overflow:hidden;height:100vh;display:flex;justify-content:center;align-items:center}#game-container{position:relative;width:100%;height:100%;max-width:600px;background:radial-gradient(circle,#1a1a2e,#000)}canvas{display:block;width:100%;height:100%}.ui{position:absolute;top:0;left:0;width:100%;padding:20px;display:flex;justify-content:space-between;z-index:10}.panel{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);padding:10px 20px;border-radius:12px}.menu{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20}.hidden{display:none}h1{font-size:2.5rem;background:linear-gradient(90deg,var(--neon-blue),var(--neon-pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:20px}.btn{background:linear-gradient(45deg,var(--neon-blue),#0088ff);border:none;padding:15px 40px;color:#000;font-weight:bold;border-radius:30px;cursor:pointer;margin:10px;box-shadow:0 0 20px var(--neon-blue)}.btn:hover{transform:scale(1.05)}</style></head><body><div id="game-container"><canvas id="c"></canvas><div class="ui"><div class="panel">Score: <span id="score">0</span></div><div class="panel">Combo: <span id="combo">0</span></div></div><div id="startMenu" class="menu"><h1>RHYTHM BLADE</h1><p style="color:var(--neon-pink);margin-bottom:20px;">برش با ریتم موسیقی</p><button class="btn" onclick="game.start()">شروع</button><p style="margin-top:20px;color:#aaa">موس را بکشید تا ببرید</p></div><div id="gameOverMenu" class="menu hidden"><h1 style="color:red">GAME OVER</h1><p>امتیاز: <span id="finalScore">0</span></p><button class="btn" onclick="game.restart()">تلاش مجدد</button></div></div><script>
class AudioEngine{constructor(){this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=0.3;this.master.connect(this.ctx.destination);this.bpm=120;this.nextNote=0;this.beat=0;this.notes=[];this.isPlaying=false}playTone(f,t,d,v=1){if(this.ctx.state==='suspended')this.ctx.resume();const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=t;o.frequency.setValueAtTime(f,this.ctx.currentTime);g.gain.setValueAtTime(v,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+d);o.connect(g);g.connect(this.master);o.start();o.stop(this.ctx.currentTime+d)}playBeat(){this.playTone(200,'square',0.1,0.5);this.playTone(100,'sine',0.15,0.5)}playSlice(){this.playTone(800+Math.random()*400,'sawtooth',0.1,0.3)}playMiss(){this.playTone(150,'sawtooth',0.3,0.5)}schedule(){const t=this.ctx.currentTime;if(t>=this.nextNote){this.playBeat();this.spawnNote();this.nextNote=t+60/this.bpm/4;this.beat++}}start(){this.isPlaying=true;this.nextNote=this.ctx.currentTime+0.1;this.loop()}loop(){if(!this.isPlaying)return;this.schedule();requestAnimationFrame(()=>this.loop())}spawnNote(){if(Math.random()>0.3)game.notes.push({x:Math.random()*game.width,y:-50,speed:150+this.beat*5,type:Math.random()>0.5?'circle':'rect',hit:false})}}
class Game{constructor(){this.c=document.getElementById('c');this.x=this.c.getContext('2d');this.resize();this.audio=new AudioEngine();this.score=0;this.combo=0;this.notes=[];this.particles=[];this.trail=[];this.isDragging=false;this.lastPos={x:0,y:0};this.gameState='MENU';this.c.addEventListener('mousedown',e=>{this.isDragging=true;this.lastPos={x:e.clientX,y:e.clientY}});this.c.addEventListener('mousemove',e=>{if(this.isDragging){this.trail.push({x:e.clientX,y:e.clientY,life:1});this.checkCollisions(e.clientX,e.clientY)}});this.c.addEventListener('mouseup',()=>this.isDragging=false);this.c.addEventListener('touchstart',e=>{this.isDragging=true;this.lastPos={x:e.touches[0].clientX,y:e.touches[0].clientY}}, {passive:false});this.c.addEventListener('touchmove',e=>{if(this.isDragging){e.preventDefault();this.trail.push({x:e.touches[0].clientX,y:e.touches[0].clientY,life:1});this.checkCollisions(e.touches[0].clientX,e.touches[0].clientY)}},{passive:false});this.c.addEventListener('touchend',()=>this.isDragging=false);window.addEventListener('resize',()=>this.resize());requestAnimationFrame(t=>this.loop(t))}resize(){this.width=this.c.width=this.c.parentElement.clientWidth;this.height=this.c.height=this.c.parentElement.clientHeight}start(){document.getElementById('startMenu').classList.add('hidden');this.gameState='PLAYING';this.score=0;this.combo=0;this.notes=[];this.audio.start()}restart(){this.start();document.getElementById('gameOverMenu').classList.add('hidden')}checkCollisions(mx,my){for(let n of this.notes){if(n.hit)continue;const dx=mx-n.x,dy=my-n.y;if(Math.sqrt(dx*dx+dy*dy)<40){n.hit=true;this.score+=100+this.combo*10;this.combo++;this.audio.playSlice();this.createParticles(n.x,n.y,'#00f3ff');this.updateUI()}}}createParticles(x,y,color){for(let i=0;i<10;i++){this.particles.push({x,y,vx:(Math.random()-0.5)*200,vy:(Math.random()-0.5)*200,life:0.5,color})}}updateUI(){document.getElementById('score').innerText=this.score;document.getElementById('combo').innerText=this.combo}loop(t){this.x.fillStyle='rgba(5,5,16,0.2)';this.x.fillRect(0,0,this.width,this.height);if(this.gameState==='PLAYING'){this.audio.loop();for(let i=this.notes.length-1;i>=0;i--){let n=this.notes[i];n.y+=n.speed/60;if(n.y>this.height)this.notes.splice(i,1);else if(!n.hit){this.x.shadowBlur=15;this.x.shadowColor='#ff00ff';this.x.fillStyle='#ff00ff';if(n.type==='circle'){this.x.beginPath();this.x.arc(n.x,n.y,20,0,Math.PI*2);this.x.fill()}else{this.x.fillRect(n.x-15,n.y-15,30,30)}}}for(let i=this.trail.length-1;i>=0;i--){this.trail[i].life-=0.05;if(this.trail[i].life<=0)this.trail.splice(i,1)}for(let i=this.particles.length-1;i>=0;i--){let p=this.particles[i];p.x+=p.vx/60;p.y+=p.vy/60;p.life-=0.02;if(p.life<=0)this.particles.splice(i,1)}this.x.strokeStyle='#00f3ff';this.x.lineWidth=3;this.x.shadowBlur=10;this.x.shadowColor='#00f3ff';if(this.trail.length>1){this.x.beginPath();this.x.moveTo(this.trail[0].x,this.trail[0].y);for(let t of this.trail)this.x.lineTo(t.x,t.y);this.x.stroke()}this.particles.forEach(p=>{this.x.fillStyle=p.color;this.x.globalAlpha=p.life*2;this.x.beginPath();this.x.arc(p.x,p.y,3,0,Math.PI*2);this.x.fill()});this.x.globalAlpha=1;if(this.notes.filter(n=>!n.hit&&n.y>this.height).length>5){this.audio.playMiss();this.combo=0;this.updateUI();if(this.score>0){this.gameState='GAMEOVER';document.getElementById('finalScore').innerText=this.score;document.getElementById('gameOverMenu').classList.remove('hidden')}}}requestAnimationFrame(t=>this.loop(t))}}const game=new Game();
</script></body></html>
