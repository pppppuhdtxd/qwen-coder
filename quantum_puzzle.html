<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quantum Puzzle</title><style>:root{--neon-blue:#00f3ff;--neon-pink:#ff00ff;--bg:#050510}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:#fff;font-family:sans-serif;overflow:hidden;height:100vh;display:flex;justify-content:center;align-items:center}#game-container{position:relative;width:100%;height:100%;max-width:700px;background:radial-gradient(circle,#1a1a2e,#000)}canvas{display:block;width:100%;height:100%}.ui{position:absolute;top:0;left:0;width:100%;padding:20px;display:flex;justify-content:space-between;z-index:10}.panel{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);padding:10px 20px;border-radius:12px}.menu{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20}.hidden{display:none}h1{font-size:2.5rem;background:linear-gradient(90deg,var(--neon-blue),var(--neon-pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:20px}.btn{background:linear-gradient(45deg,var(--neon-blue),#0088ff);border:none;padding:15px 40px;color:#000;font-weight:bold;border-radius:30px;cursor:pointer;margin:10px;box-shadow:0 0 20px var(--neon-blue)}.btn:hover{transform:scale(1.05)}</style></head><body><div id="game-container"><canvas id="c"></canvas><div class="ui"><div class="panel">Level: <span id="lvl">1</span></div><div class="panel">Moves: <span id="mv">0</span></div></div><div id="startMenu" class="menu"><h1>QUANTUM PUZZLE</h1><p style="color:var(--neon-pink);margin-bottom:20px;">بازتاب لیزر به هدف</p><button class="btn" onclick="game.start()">شروع</button><p style="margin-top:20px;color:#aaa">کلیک برای قرار دادن آینه</p></div><div id="winMenu" class="menu hidden"><h1 style="color:var(--neon-green)">LEVEL COMPLETE</h1><button class="btn" onclick="game.nextLevel()">مرحله بعد</button></div></div><script>
class Sound{constructor(){this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.g=this.ctx.createGain();this.g.gain.value=0.3;this.g.connect(this.ctx.destination)}play(f,t,d){if(this.ctx.state==='suspended')this.ctx.resume();const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(0.3,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+d);o.connect(g);g.connect(this.g);o.start();o.stop(this.ctx.currentTime+d)}}
class Game{constructor(){this.c=document.getElementById('c');this.x=this.c.getContext('2d');this.resize();this.audio=new Sound();this.level=1;this.moves=0;this.gridSize=50;this.mirrors=[];this.laserPath=[];this.target={x:0,y:0};this.emitter={x:0,y:0,dir:'right'};this.levels=[{emitter:{x:0,y:2,dir:'right'},target:{x:4,y:2},mirrors:[{x:2,y:2,type:'/'}]},{emitter:{x:0,y:0,dir:'right'},target:{x:4,y:4},mirrors:[{x:1,y:1,type:'/'},{x:3,y:3,type:'/'}]},{emitter:{x:0,y:4,dir:'right'},target:{x:4,y:0},mirrors:[{x:1,y:3,type:'\\'},{x:2,y:2,type:'/'},{x:3,y:1,type:'\\'}]},{emitter:{x:2,y:0,dir:'down'},target:{x:4,y:4},mirrors:[{x:2,y:2,type:'/'},{x:4,y:3,type:'\\'}]},{emitter:{x:0,y:2,dir:'right'},target:{x:2,y:4},mirrors:[{x:1,y:2,type:'\\'}]}];this.loadLevel(0);this.c.addEventListener('click',e=>this.handleClick(e));window.addEventListener('resize',()=>this.resize());requestAnimationFrame(t=>this.loop(t))}resize(){this.c.width=this.c.parentElement.clientWidth;this.c.height=this.c.parentElement.clientHeight;this.cellSize=Math.min(this.c.width,this.c.height)/6}loadLevel(i){const l=this.levels[i%this.levels.length];this.emitter=l.emitter;this.target=l.target;this.mirrors=[...l.mirrors];this.moves=0;this.calcLaserPath();this.updateUI()}start(){document.getElementById('startMenu').classList.add('hidden');this.audio.play(600,'sine',0.2)}nextLevel(){this.level++;this.loadLevel(this.level-1);document.getElementById('winMenu').classList.add('hidden')}handleClick(e){const r=this.c.getBoundingClientRect();const x=Math.floor((e.clientX-r.x)/this.cellSize);const y=Math.floor((e.clientY-r.y)/this.cellSize);if(x===this.emitter.x&&y===this.emitter.y)return;if(x===this.target.x&&y===this.target.y)return;const idx=this.mirrors.findIndex(m=>m.x===x&&m.y===y);if(idx>=0){this.mirrors.splice(idx,1);this.audio.play(300,'square',0.1)}else{this.mirrors.push({x,y,type:this.moves%2===0?'/':'\\'});this.audio.play(800,'sine',0.1)}this.moves++;this.calcLaserPath();this.updateUI();this.checkWin()}calcLaserPath(){this.laserPath=[];let cx=this.emitter.x+0.5,cy=this.emitter.y+0.5;let dx=this.emitter.dir==='right'?1:this.emitter.dir==='left'?-1:this.emitter.dir==='down'?0:0;let dy=this.emitter.dir==='down'?1:this.emitter.dir==='up'?-1:0;if(this.emitter.dir==='right'||this.emitter.dir==='left')dy=0;else dx=0;for(let i=0;i<20;i++){cx+=dx*0.5;cy+=dy*0.5;this.laserPath.push({x:cx,y:cy});const mx=Math.floor(cx),my=Math.floor(cy);const m=this.mirrors.find(m=>m.x===mx&&m.y===my);if(m){if(m.type==='/'){const t=dx;dx=-dy;dy=t;}else{const t=dx;dx=dy;dy=t;}this.laserPath.push({x:cx,y:cy});}if(cx<0||cx>this.gridSize||cy<0||cy>this.gridSize)break}}checkWin(){const last=this.laserPath[this.laserPath.length-1];if(Math.abs(last.x-(this.target.x+0.5))<0.6&&Math.abs(last.y-(this.target.y+0.5))<0.6){this.audio.play(1000,'sine',0.3);setTimeout(()=>{document.getElementById('winMenu').classList.remove('hidden')},300)}}updateUI(){document.getElementById('lvl').innerText=this.level;document.getElementById('mv').innerText=this.moves}loop(t){this.x.fillStyle='rgba(5,5,16,0.5)';this.x.fillRect(0,0,this.c.width,this.c.height);this.x.save();this.x.translate(20,20);for(let i=0;i<=5;i++){this.x.strokeStyle='rgba(0,243,255,0.2)';this.x.beginPath();this.x.moveTo(i*this.cellSize,0);this.x.lineTo(i*this.cellSize,5*this.cellSize);this.x.stroke();this.x.beginPath();this.x.moveTo(0,i*this.cellSize);this.x.lineTo(5*this.cellSize,i*this.cellSize);this.x.stroke();}this.mirrors.forEach(m=>{this.x.fillStyle='#ff00ff';this.x.shadowBlur=15;this.x.shadowColor='#ff00ff';this.x.fillRect(m.x*this.cellSize+10,m.y*this.cellSize+10,this.cellSize-20,this.cellSize-20);this.x.strokeStyle='#fff';this.x.lineWidth=2;this.x.beginPath();if(m.type==='/'){this.x.moveTo(m.x*this.cellSize+10,m.y*this.cellSize+this.cellSize-10);this.x.lineTo(m.x*this.cellSize+this.cellSize-10,m.y*this.cellSize+10);}else{this.x.moveTo(m.x*this.cellSize+10,m.y*this.cellSize+10);this.x.lineTo(m.x*this.cellSize+this.cellSize-10,m.y*this.cellSize+this.cellSize-10);}this.x.stroke()});this.x.shadowBlur=20;this.x.shadowColor='#00f3ff';this.x.fillStyle='#00f3ff';this.x.beginPath();this.x.arc((this.emitter.x+0.5)*this.cellSize,(this.emitter.y+0.5)*this.cellSize,8,0,Math.PI*2);this.x.fill();this.x.fillStyle='#00ff41';this.x.shadowColor='#00ff41';this.x.beginPath();this.x.arc((this.target.x+0.5)*this.cellSize,(this.target.y+0.5)*this.cellSize,12,0,Math.PI*2);this.x.fill();if(this.laserPath.length>1){this.x.strokeStyle='#00f3ff';this.x.lineWidth=3;this.x.shadowBlur=10;this.x.beginPath();this.x.moveTo(this.laserPath[0].x*this.cellSize,this.laserPath[0].y*this.cellSize);for(let i=1;i<this.laserPath.length;i++)this.x.lineTo(this.laserPath[i].x*this.cellSize,this.laserPath[i].y*this.cellSize);this.x.stroke()}this.x.restore()}}const game=new Game();
</script></body></html>
