<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gravity Defender - مدافع گرانشی</title>
    <style>
        :root { --neon-blue: #00f3ff; --neon-pink: #ff00ff; --neon-green: #00ff41; --neon-orange: #ff9500; --bg-dark: #050510; --glass-bg: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #game-container { position: relative; width: 100%; height: 100%; max-width: 800px; background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%); box-shadow: 0 0 50px rgba(0, 243, 255, 0.1); overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 10; }
        .hud-top { display: flex; justify-content: space-between; font-size: 1.2rem; text-shadow: 0 0 10px var(--neon-blue); }
        .score-box, .health-box { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); padding: 10px 20px; border-radius: 12px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .health-bar { width: 200px; height: 10px; background: rgba(255,0,0,0.3); border-radius: 5px; overflow: hidden; margin-top: 5px; }
        .health-fill { height: 100%; background: linear-gradient(90deg, #ff0000, #00ff41); width: 100%; transition: width 0.2s; }
        .menu-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; pointer-events: auto; transition: opacity 0.3s; }
        .hidden { opacity: 0; pointer-events: none; }
        h1 { font-size: 3rem; margin-bottom: 10px; background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(0, 243, 255, 0.5); text-transform: uppercase; letter-spacing: 4px; text-align: center; }
        .btn { background: linear-gradient(45deg, var(--neon-blue), #0088ff); border: none; padding: 15px 40px; color: #000; font-weight: bold; font-size: 1.2rem; border-radius: 30px; cursor: pointer; margin-top: 20px; box-shadow: 0 0 20px var(--neon-blue); transition: transform 0.1s, box-shadow 0.1s; text-transform: uppercase; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 40px var(--neon-blue); }
        .btn:active { transform: scale(0.95); }
        .stats { margin-top: 20px; text-align: center; color: #aaa; font-size: 0.9rem; }
        .controls-hint { margin-top: 30px; font-size: 0.8rem; color: var(--neon-green); opacity: 0.8; text-align: center;}
    </style>
</head>
<body>
<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="ui-layer">
        <div class="hud-top">
            <div class="score-box">امتیاز: <span id="scoreEl">0</span></div>
            <div class="health-box"><div>انرژی هسته</div><div class="health-bar"><div class="health-fill" id="healthFill"></div></div></div>
        </div>
    </div>
    <div id="startMenu" class="menu-screen">
        <h1>GRAVITY DEFENDER</h1>
        <p style="color: var(--neon-pink); letter-spacing: 2px;">محافظت 360 درجه از هسته مرکزی</p>
        <button class="btn" id="startBtn">فعال‌سازی سپر</button>
        <div class="stats">بهترین رکورد: <span id="highScoreEl">0</span></div>
        <div class="controls-hint">کنترل: حرکت موس یا لمس برای چرخش<br>کلیک/ضربه برای شلیک</div>
    </div>
    <div id="gameOverMenu" class="menu-screen hidden">
        <h1 style="color: var(--neon-orange);">SYSTEM FAILURE</h1>
        <p style="font-size: 1.5rem;">امتیاز نهایی: <span id="finalScore">0</span></p>
        <button class="btn" id="restartBtn">راه‌اندازی مجدد</button>
    </div>
</div>
<script>
class SoundSynth {
    constructor() { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.masterGain = this.ctx.createGain(); this.masterGain.gain.value = 0.3; this.masterGain.connect(this.ctx.destination); }
    playTone(freq, type, duration, vol = 1) {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain); gain.connect(this.masterGain); osc.start(); osc.stop(this.ctx.currentTime + duration);
    }
    playShoot() { this.playTone(400, 'square', 0.1, 0.3); this.playTone(200, 'sawtooth', 0.15, 0.3); }
    playExplosion() { this.playTone(100, 'sawtooth', 0.4, 0.6); this.playTone(50, 'square', 0.5, 0.6); }
    playHit() { this.playTone(800, 'sine', 0.1, 0.4); }
}
class Particle {
    constructor() { this.reset(); }
    reset() { this.x = 0; this.y = 0; this.vx = 0; this.vy = 0; this.life = 0; this.maxLife = 1; this.color = '#fff'; this.size = 2; this.active = false; }
    spawn(x, y, vx, vy, color, life) { this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.color = color; this.life = life; this.maxLife = life; this.active = true; }
    update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; this.life -= dt; this.size *= 0.95; return this.life <= 0; }
    draw(ctx) { ctx.globalAlpha = this.life / this.maxLife; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
}
class Bullet {
    constructor() { this.reset(); }
    reset() { this.x = 0; this.y = 0; this.vx = 0; this.vy = 0; this.active = false; this.dist = 0; this.maxDist = 500; }
    spawn(x, y, angle, speed) { this.x = x; this.y = y; this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed; this.active = true; this.dist = 0; }
    update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; this.dist += Math.sqrt(this.vx*this.vx + this.vy*this.vy) * dt; return this.dist > this.maxDist; }
    draw(ctx) { ctx.save(); ctx.shadowBlur = 10; ctx.shadowColor = '#00f3ff'; ctx.fillStyle = '#00f3ff'; ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI*2); ctx.fill(); ctx.restore(); }
}
class Enemy {
    constructor() { this.reset(); }
    reset() { this.x = 0; this.y = 0; this.angle = 0; this.speed = 50; this.active = false; this.hp = 1; this.size = 15; }
    spawn(cx, cy, angle, difficulty) {
        const dist = Math.max(cx, cy) + 50;
        this.x = cx + Math.cos(angle) * dist; this.y = cy + Math.sin(angle) * dist;
        this.angle = angle; this.speed = 80 + difficulty * 10; this.hp = 1 + Math.floor(difficulty / 5); this.active = true; this.size = 12 + Math.random() * 8;
    }
    update(dt, cx, cy) {
        const dx = cx - this.x, dy = cy - this.y, dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > 0) { this.x += (dx / dist) * this.speed * dt; this.y += (dy / dist) * this.speed * dt; }
        return dist < 30;
    }
    draw(ctx) {
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle + Date.now()/200);
        ctx.shadowBlur = 10; ctx.shadowColor = '#ff00ff'; ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 2;
        ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
        ctx.fillStyle = 'rgba(255, 0, 255, 0.3)'; ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size); ctx.restore();
    }
}
class GravityDefender {
    constructor() {
        this.canvas = document.getElementById('gameCanvas'); this.ctx = this.canvas.getContext('2d'); this.resize();
        this.audio = new SoundSynth(); this.lastTime = 0; this.score = 0; this.health = 100; this.gameState = 'MENU'; this.difficulty = 1;
        this.core = { x: this.width/2, y: this.height/2, radius: 25, angle: 0 }; this.mouseAngle = 0;
        this.pools = { particles: [], bullets: [], enemies: [] };
        for(let i=0; i<100; i++) this.pools.particles.push(new Particle());
        for(let i=0; i<50; i++) this.pools.bullets.push(new Bullet());
        for(let i=0; i<30; i++) this.pools.enemies.push(new Enemy());
        this.activeParticles = []; this.activeBullets = []; this.activeEnemies = []; this.enemyTimer = 0;
        this.highScore = parseInt(localStorage.getItem('gravityDefenderHighScore')) || 0;
        document.getElementById('highScoreEl').innerText = this.highScore;
        this.bindInput(); window.addEventListener('resize', () => this.resize());
        requestAnimationFrame(t => this.loop(t));
    }
    resize() { this.width = this.canvas.width = this.canvas.parentElement.clientWidth; this.height = this.canvas.height = this.canvas.parentElement.clientHeight; this.core.x = this.width/2; this.core.y = this.height/2; }
    bindInput() {
        const updateAngle = (x, y) => { const dx = x - this.core.x, dy = y - this.core.y; this.mouseAngle = Math.atan2(dy, dx); };
        this.canvas.addEventListener('mousemove', e => { if (this.gameState === 'PLAYING') updateAngle(e.clientX, e.clientY); });
        this.canvas.addEventListener('touchmove', e => { e.preventDefault(); if (this.gameState === 'PLAYING') updateAngle(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
        const shoot = () => { if (this.gameState !== 'PLAYING') return; this.spawnBullet(); };
        this.canvas.addEventListener('mousedown', shoot);
        this.canvas.addEventListener('touchstart', (e) => { e.preventDefault(); updateAngle(e.touches[0].clientX, e.touches[0].clientY); shoot(); }, {passive: false});
        document.getElementById('startBtn').addEventListener('click', () => this.startGame());
        document.getElementById('restartBtn').addEventListener('click', () => this.startGame());
    }
    startGame() {
        this.gameState = 'PLAYING'; this.score = 0; this.health = 100; this.difficulty = 1;
        this.activeBullets = []; this.activeEnemies = []; this.activeParticles = [];
        document.getElementById('startMenu').classList.add('hidden'); document.getElementById('gameOverMenu').classList.add('hidden');
        this.updateHealthUI(); this.audio.ctx.resume();
    }
    gameOver() {
        this.gameState = 'GAMEOVER'; this.audio.playExplosion();
        if (this.score > this.highScore) { this.highScore = Math.floor(this.score); localStorage.setItem('gravityDefenderHighScore', this.highScore); document.getElementById('highScoreEl').innerText = this.highScore; }
        document.getElementById('finalScore').innerText = Math.floor(this.score); document.getElementById('gameOverMenu').classList.remove('hidden');
    }
    spawnBullet() {
        const b = this.pools.bullets.find(b => !this.activeBullets.includes(b));
        if (b) { b.spawn(this.core.x, this.core.y, this.mouseAngle, 600); this.activeBullets.push(b); this.audio.playShoot(); }
    }
    spawnEnemy() {
        const e = this.pools.enemies.find(e => !this.activeEnemies.includes(e));
        if (e) { const angle = Math.random() * Math.PI * 2; e.spawn(this.core.x, this.core.y, angle, this.difficulty); this.activeEnemies.push(e); }
    }
    createExplosion(x, y, color, count=10) {
        for(let i=0; i<count; i++) {
            const p = this.pools.particles.find(p => !this.activeParticles.includes(p));
            if (p) { const angle = Math.random() * Math.PI * 2, spd = Math.random() * 150 + 50; p.spawn(x, y, Math.cos(angle)*spd, Math.sin(angle)*spd, color, 0.4 + Math.random()*0.4); this.activeParticles.push(p); }
        }
    }
    updateHealthUI() { document.getElementById('healthFill').style.width = `${Math.max(0, this.health)}%`; }
    update(dt) {
        if (this.gameState !== 'PLAYING') return;
        this.difficulty += dt * 0.05; this.score += dt * 10;
        this.enemyTimer -= dt;
        if (this.enemyTimer <= 0) { this.spawnEnemy(); this.enemyTimer = Math.max(0.3, 1.5 - this.difficulty * 0.1); }
        for (let i = this.activeBullets.length - 1; i >= 0; i--) { if (this.activeBullets[i].update(dt)) this.activeBullets.splice(i, 1); }
        for (let i = this.activeEnemies.length - 1; i >= 0; i--) {
            const e = this.activeEnemies[i];
            if (e.update(dt, this.core.x, this.core.y)) {
                this.health -= 10; this.updateHealthUI(); this.createExplosion(e.x, e.y, '#ff0000', 15); this.activeEnemies.splice(i, 1);
                if (this.health <= 0) this.gameOver(); continue;
            }
            for (let j = this.activeBullets.length - 1; j >= 0; j--) {
                const b = this.activeBullets[j], dx = e.x - b.x, dy = e.y - b.y, dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < e.size + 5) {
                    e.hp--; this.activeBullets.splice(j, 1); this.createExplosion(b.x, b.y, '#00f3ff', 5);
                    if (e.hp <= 0) { this.score += 50; this.createExplosion(e.x, e.y, '#ff00ff', 20); this.activeEnemies.splice(i, 1); this.audio.playHit(); }
                    break;
                }
            }
        }
        for (let i = this.activeParticles.length - 1; i >= 0; i--) { if (this.activeParticles[i].update(dt)) this.activeParticles.splice(i, 1); }
        document.getElementById('scoreEl').innerText = Math.floor(this.score);
    }
    draw() {
        this.ctx.fillStyle = 'rgba(5, 5, 16, 0.3)'; this.ctx.fillRect(0, 0, this.width, this.height);
        this.ctx.save(); this.ctx.translate(this.core.x, this.core.y); this.ctx.rotate(this.mouseAngle);
        this.ctx.shadowBlur = 30; this.ctx.shadowColor = '#00ff41'; this.ctx.fillStyle = '#00ff41';
        this.ctx.beginPath(); this.ctx.arc(0, 0, this.core.radius, 0, Math.PI*2); this.ctx.fill();
        this.ctx.fillStyle = '#fff'; this.ctx.fillRect(0, -5, 40, 10); this.ctx.restore();
        this.activeBullets.forEach(b => b.draw(this.ctx)); this.activeEnemies.forEach(e => e.draw(this.ctx)); this.activeParticles.forEach(p => p.draw(this.ctx));
        if (this.gameState === 'PLAYING') {
            this.ctx.save(); this.ctx.strokeStyle = 'rgba(0, 243, 255, 0.2)'; this.ctx.setLineDash([5, 10]); this.ctx.beginPath();
            this.ctx.moveTo(this.core.x, this.core.y);
            this.ctx.lineTo(this.core.x + Math.cos(this.mouseAngle) * 100, this.core.y + Math.sin(this.mouseAngle) * 100); this.ctx.stroke(); this.ctx.restore();
        }
    }
    loop(timestamp) { const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1); this.lastTime = timestamp; this.update(dt); this.draw(); requestAnimationFrame(t => this.loop(t)); }
}
window.onload = () => { const game = new GravityDefender(); };
</script>
</body>
</html>
